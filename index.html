<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shoostargram</title>
    <meta name="description" content="휴대폰에서 앱처럼 보이는 모바일 SNS 목업" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="phone-shell">
      <div class="statusbar">
        <span>9:41</span>
        <span>◔◔◔</span>
      </div>

      <header class="topbar">
        <div class="brand">Shoostargram</div>
        <div class="top-actions">
          <button class="icon-btn">♡</button>
          <button class="icon-btn">✈</button>
        </div>
      </header>

      <main class="app-body">
        <section class="stories">
          <div class="story active">
            <div class="story-ring">Y</div>
            <span>you</span>
          </div>
          <div class="story">
            <div class="story-ring">N</div>
            <span>nana</span>
          </div>
          <div class="story">
            <div class="story-ring">J</div>
            <span>joo</span>
          </div>
          <div class="story">
            <div class="story-ring">M</div>
            <span>milo</span>
          </div>
        </section>

        <section class="feed">
          <article class="post">
            <div class="post-header">
              <div class="user">
                <div class="avatar avatar-a">Y</div>
                <div>
                  <div class="name">youngho</div>
                  <div class="location">Seoul</div>
                </div>
              </div>
              <button class="more-btn">⋯</button>
            </div>

            <div class="image image-one"></div>

            <div class="post-actions">
              <div class="left-actions">
                <button class="action-btn">♡</button>
                <button class="action-btn">💬</button>
                <button class="action-btn">✈</button>
              </div>
              <button class="action-btn">🔖</button>
            </div>

            <div class="post-meta">
              <strong>124 likes</strong>
              <p><span>youngho</span> 오늘의 분위기, 햇살이 좋아서 카페 한 잔과 함께.</p>
            </div>
          </article>

          <article class="post">
            <div class="post-header">
              <div class="user">
                <div class="avatar avatar-b">N</div>
                <div>
                  <div class="name">nana</div>
                  <div class="location">Busan</div>
                </div>
              </div>
              <button class="more-btn">⋯</button>
            </div>

            <div class="image image-two"></div>

            <div class="post-actions">
              <div class="left-actions">
                <button class="action-btn">♡</button>
                <button class="action-btn">💬</button>
                <button class="action-btn">✈</button>
              </div>
              <button class="action-btn">🔖</button>
            </div>

            <div class="post-meta">
              <strong>200 likes</strong>
              <p><span>nana</span> 바람 부는 날에 가장 잘 어울리는 색감.</p>
            </div>
          </article>
        </section>
      </main>

      <nav class="bottom-nav">
        <button class="nav-btn active">⌂</button>
        <button class="nav-btn">⌕</button>
        <button class="nav-btn plus">＋</button>
        <button class="nav-btn">♡</button>
        <button class="nav-btn profile">◉</button>
      </nav>
    </div>

    <script src="script.js"></script>
  </body>
</html>
